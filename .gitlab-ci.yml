image: gradle:jdk17

cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches

before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle
  - chmod a+x gradlew

stages:
  - prepare
  - build

wrapper:
  stage: prepare
  script:
    - gradle wrapper

compile:
  stage: build
  dependencies:
    - wrapper
  script:
    - ./gradlew assemble
  artifacts:
    paths:
      - build/classes/**
      - build/libs/*.jar
