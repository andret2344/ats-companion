image: gradle:jdk17

cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches

before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle
  - chmod a+x gradlew

stages:
  - prepare
  - build
  - test
  - deplot

wrapper:
  stage: prepare
  script:
    - gradle wrapper

compile:
  stage: build
  dependencies:
    - wrapper
  script:
    - ./gradlew assemble
  artifacts:
    paths:
      - build/libs/*.jar

junit:
  stage: test
  dependencies:
    - wrapper
  script:
    - ./gradlew clean test
  coverage: '/^Coverage:\s(\d+\.\d+%)/'
  artifacts:
    reports:
      junit:
        - build/test-results/test/*.xml
    paths:
      - build/reports/jacoco/test/html/**

pages:
  stage: deploy
  dependencies:
    - junit
  script:
    - mv build/reports/jacoco/test/html/ public/
  artifacts:
    paths:
      - public/**
  only:
    - master
  when: manual
