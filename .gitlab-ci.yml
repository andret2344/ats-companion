image: gradle:8.2-jdk17

before_script:
  - chmod a+x gradlew

stages:
  - build
  - test
  - deploy

compile:
  stage: build
  script:
    - ./gradlew assemble
  artifacts:
    paths:
      - build/libs/*.jar

unit:
  stage: test
  script:
    - ./gradlew test
  coverage: '/    - Instruction Coverage: ([0-9.]+)%/'
  artifacts:
    reports:
      junit:
        - build/test-results/test/*.xml
    paths:
      - build/reports/kover/html/**

pages:
  stage: deploy
  dependencies:
    - unit
  script:
    - mv build/reports/jacoco/test/html/ public/
  artifacts:
    paths:
      - public/**
  only:
    - main
  when: manual
