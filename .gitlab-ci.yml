image: gradle:jdk11

cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches

before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle
  - chmod a+x gradlew

stages:
  - prepare
  - build
  - deploy

wrapper:
  stage: prepare
  script:
    - gradle wrapper

compile:
  stage: build
  dependencies:
    - wrapper
  script:
    - ./gradlew assemble
  artifacts:
    paths:
      - build/classes/**
      - build/libs/*.jar

publish:
  stage: deploy
  script:
    - ./gradlew clean
    - ./gradlew publishPlugin
  only:
    - master
  when: manual
