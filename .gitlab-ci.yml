image: openjdk:17-alpine

before_script:
  - chmod a+x gradlew

stages:
  - build
  - test
  - deploy

compile:
  stage: build
  script:
    - ./gradlew assemble
  artifacts:
    paths:
      - build/libs/*.jar

junit:
  stage: test
  script:
    - ./gradlew clean test --scan
  coverage: '/    - Instruction Coverage: ([0-9.]+)%/'
  artifacts:
    reports:
      junit:
        - build/test-results/test/*.xml
    paths:
      - build/reports/jacoco/test/html/**

pages:
  stage: deploy
  script:
    - mv build/reports/jacoco/test/html/ public/
  artifacts:
    paths:
      - public/**
  only:
    - master
  when: manual
