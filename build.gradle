plugins {
	id 'org.jetbrains.intellij' version '1.1.4'
}

apply plugin: 'java'
apply plugin: 'idea'

sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

// See https://github.com/JetBrains/gradle-intellij-plugin/
intellij {
	version = '2021.2'
	plugins = ['com.intellij.java']
}

buildSearchableOptions {
	enabled = false
}

patchPluginXml {
	version = project.version
	sinceBuild = '202'
	untilBuild = '212.*'
}

group 'eu.andret.ats.idea'
version '0.0.1'

repositories {
	mavenCentral()
	maven { url 'https://gitlab.com/api/v4/groups/2877017/-/packages/maven' }
}

dependencies {
	implementation group: 'eu.andret', name: 'ats-arguments', version: '0.1.1.2'
}

println "PUBLISH_TOKEN = " + System.getenv("PUBLISH_TOKEN")
println "CERTIFICATE_CHAIN = " + System.getenv("CERTIFICATE_CHAIN")
println "PRIVATE_KEY = " + System.getenv("PRIVATE_KEY")
println "PRIVATE_KEY_PASSWORD = " + System.getenv("PRIVATE_KEY_PASSWORD")

publishPlugin {
	channels = ['alpha']
	token = System.getenv("PUBLISH_TOKEN")
}

signPlugin {
	certificateChain = System.getenv("CERTIFICATE_CHAIN")
	privateKey = System.getenv("PRIVATE_KEY")
	password = System.getenv("PRIVATE_KEY_PASSWORD")
}
