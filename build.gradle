plugins {
	id 'org.jetbrains.intellij' version '1.1.4'
}

apply plugin: 'java'
apply plugin: 'idea'

sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

// See https://github.com/JetBrains/gradle-intellij-plugin/
intellij {
	version = '2021.2.1'
	plugins = ['com.intellij.java']
}

buildSearchableOptions {
	enabled = false
}

patchPluginXml {
	version = project.version
	sinceBuild = '202'
	untilBuild = '212.*'
}

group project.group
version project.version

repositories {
	mavenCentral()
	maven { url 'https://gitlab.com/api/v4/groups/2877017/-/packages/maven' }
}

dependencies {
	compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.20'
	implementation group: 'eu.andret', name: 'ats-arguments', version: project.argumentsVersion
	annotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.20'

	testCompileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.20'
	testAnnotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.20'
}

jar {
	from {
		configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
	}
}
